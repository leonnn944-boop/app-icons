<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>決策輔助系統</title>
  <meta name="apple-mobile-web-app-title" content="決策輔助系統">
  <meta name="theme-color" content="#081b25">
  <link rel="apple-touch-icon" sizes="180x180" href="./decision-ios-180.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./decision-ios-512.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./decision-rounded-512.png">
  <link rel="manifest" href="./decision-shared-manifest.json">
  <script>
    (function () {
      var TARGET = "https://script.google.com/macros/s/AKfycbyySh8qEWYznoVH0rL6X8LXfHwmE0uXfDOhBV0Kd5paALh-skV4xHVNBqPK5Hng4Rja/exec";
      var params = new URLSearchParams(window.location.search);
      if (params.get('go') === '1') {
        window.location.replace(TARGET);
        return;
      }
      try {
        window.history.replaceState(null, '', window.location.pathname + '?go=1');
      } catch (e) {}
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: #081b25; color: #f6f4f1;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", sans-serif;
    }
    body { display: grid; place-items: center; padding: 24px; }
    .card {
      width: min(380px, 100%);
      background: #0e2937;
      border: 1px solid rgba(140,227,219,0.18);
      border-radius: 26px;
      padding: 32px 24px 26px;
      text-align: center;
      box-shadow: 0 22px 60px rgba(0,0,0,0.38);
    }
    .icon {
      width: 96px; height: 96px; border-radius: 22px;
      display: block; margin: 0 auto 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: 0.02em; }
    .sub { margin: 0 0 22px; font-size: 13px; color: #9cb9c4; }
    .btn {
      display: block; width: 100%; padding: 13px 18px;
      border-radius: 14px; text-decoration: none;
      background: #28b8c9; color: #04161e;
      font-weight: 700; font-size: 15px;
    }
    .steps {
      margin: 20px 0 0; padding: 14px 16px;
      border-radius: 14px; background: rgba(0,0,0,0.18);
      text-align: left; font-size: 13px; line-height: 1.65; color: #9cb9c4;
    }
    .steps strong { color: #f6f4f1; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="./decision-rounded-512.png" alt="決策輔助系統">
    <h1>決策輔助系統</h1>
    <p class="sub">共用版工作台</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbyySh8qEWYznoVH0rL6X8LXfHwmE0uXfDOhBV0Kd5paALh-skV4xHVNBqPK5Hng4Rja/exec">直接開啟系統</a>
    <div class="steps">
      <strong>加到 iPhone 主畫面（有圖示）</strong><br>
      1. 點 Safari 下方「分享」→「加入主畫面」<br>
      2. 之後點主畫面圖示，就會自動跳轉進系統
    </div>
  </main>
</body>
</html>
