<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>居家管理系統</title>
  <meta name="apple-mobile-web-app-title" content="居家管理系統">
  <meta name="theme-color" content="#2f251e">
  <link rel="apple-touch-icon" href="https://leonnn944-boop.github.io/app-icons/home-ios-180.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="https://leonnn944-boop.github.io/app-icons/home-ios-180.png?v=3">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://leonnn944-boop.github.io/app-icons/home-ios-180.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="https://leonnn944-boop.github.io/app-icons/home-rounded-192.png?v=3">
  <link rel="icon" type="image/png" sizes="512x512" href="https://leonnn944-boop.github.io/app-icons/home-rounded-512.png?v=3">
  <link rel="shortcut icon" type="image/png" href="https://leonnn944-boop.github.io/app-icons/home-rounded-512.png?v=3">
  <meta property="og:title" content="居家管理系統">
  <meta property="og:image" content="https://leonnn944-boop.github.io/app-icons/home-ios-512.png?v=3">
  <link rel="manifest" href="https://leonnn944-boop.github.io/app-icons/home-manifest.json">
  <script>
    (function () {
      var TARGET = "https://script.google.com/macros/s/AKfycbywGMYEOIXYIvFQD8FQXZ_Eg_HOBnv5elqqZwYZyRzW6om-oHQjT5AMesLy61qiLRrEVw/exec";
      var params = new URLSearchParams(window.location.search);
      if (params.get('go') === '1') {
        window.location.replace(TARGET);
        return;
      }
      try {
        window.history.replaceState(null, '', window.location.pathname + '?go=1');
      } catch (e) {}
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: #2f251e; color: #f6f4f1;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", sans-serif;
    }
    body { display: grid; place-items: center; padding: 24px; }
    .card {
      width: min(380px, 100%);
      background: #3e3128;
      border: 1px solid rgba(255,232,214,0.14);
      border-radius: 26px;
      padding: 32px 24px 26px;
      text-align: center;
      box-shadow: 0 22px 60px rgba(0,0,0,0.38);
    }
    .icon {
      width: 96px; height: 96px; border-radius: 22px;
      display: block; margin: 0 auto 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: 0.02em; }
    .sub { margin: 0 0 18px; font-size: 13px; color: #ccb9ab; }
    .steps {
      margin: 0 0 18px; padding: 14px 16px;
      border-radius: 14px; background: rgba(0,0,0,0.22);
      text-align: left; font-size: 13px; line-height: 1.7; color: #ccb9ab;
    }
    .steps strong { color: #f6f4f1; }
    .btn {
      display: block; width: 100%; padding: 13px 18px;
      border-radius: 14px; text-decoration: none;
      background: #d97542; color: #fff9f5;
      font-weight: 700; font-size: 15px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="https://leonnn944-boop.github.io/app-icons/home-rounded-512.png?v=3" alt="居家管理系統">
    <h1>居家管理系統</h1>
    <p class="sub">把日子整理得剛剛好</p>
    <div class="steps">
      <strong>加到 iPhone 主畫面（請先停在這頁！）</strong><br>
      1. <strong>不要先點下方按鈕</strong>，直接點 Safari 下方「分享」→「加入主畫面」<br>
      2. 確認預覽框出現彩色圖示後點「新增」<br>
      3. 之後點主畫面圖示，就會自動跳轉進系統
    </div>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbywGMYEOIXYIvFQD8FQXZ_Eg_HOBnv5elqqZwYZyRzW6om-oHQjT5AMesLy61qiLRrEVw/exec">直接開啟系統</a>
  </main>
</body>
</html>
